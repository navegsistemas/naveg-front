# **Publica o `@navegsistemas/domain` no GitHub Packages.**
#
# Dispara por tag (`domain-v0.1.0`) ou à mão. A tag existe para que a versão publicada tenha um ponto no
# histórico: "que código está no 0.1.0" se responde com `git show domain-v0.1.0`, e não com memória.
#
# O `GITHUB_TOKEN` do próprio workflow basta para publicar no registro do mesmo dono — não é preciso PAT aqui.
# Quem **consome** de outro repositório (a `naveg-api`) precisa de um token de leitura; ver o README.
name: publicar @navegsistemas/domain

on:
  push:
    tags: ['domain-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@navegsistemas'

      - run: npm ci

      # O domínio não vai publicado sem os cenários passando. A camada 2 do contrato com o fluviapp fica
      # pulada aqui (o checkout do aplicativo não existe no CI) — é o esperado, e está dito no README.
      - run: npm run verify

      # A tag e a versão do pacote precisam dizer a mesma coisa. Divergir aqui é publicar 0.1.0 com o código
      # do 0.2.0 — o tipo de erro que só aparece quando alguém tenta reproduzir um build antigo.
      - name: a tag bate com a versão do pacote
        if: startsWith(github.ref, 'refs/tags/domain-v')
        run: |
          VERSAO=$(node -p "require('./packages/domain/package.json').version")
          TAG=${GITHUB_REF_NAME#domain-v}
          test "$VERSAO" = "$TAG" || { echo "tag $TAG != versão $VERSAO"; exit 1; }

      - run: node scripts/publicar-domain.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
