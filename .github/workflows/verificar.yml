# **Os checks de cada pull request** — o que tem de estar verde antes de algo entrar na `main`.
#
# A `main` vai sozinha para a homologação, e dali para produção só por promoção (plano de ambientes, §4). Então
# a conferência acontece aqui, no PR, e não depois do merge. Os jobs viram checks obrigatórios no ruleset da
# `main` e da `producao`.
#
# O job `contrato` clona o `fluviapp-kmp` e o `fluviapp`, privados, com um token *fine-grained* da org só de
# leitura deles (`FLUVIAPP_LEITURA_TOKEN`, nos segredos de Actions **e** de Dependabot — os PRs do Dependabot
# só enxergam os segredos de lá).
name: verificar

on:
  pull_request:
  push:
    branches: [main, producao]

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck, astro check e os cenários
      - run: npm run verify

  build:
    name: build e orçamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # As variáveis de homologação, que são públicas: a URL da API e a chave pública **de teste** do Turnstile
      # (a que sempre passa). Com as duas, o build monta o totem no modo que envia — o mesmo que vai ao ar.
      - run: npm run build
        env:
          PUBLIC_URL_DA_API: https://naveg-api-vercel.vercel.app
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npm run conferir:build

  contrato:
    name: contrato com o fluviapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # O centralizador, a fonte do contrato, no ramo que está em homologação; e o app Android legado, para o
      # que o KMP ainda não portou.
      - uses: actions/checkout@v7
        with:
          repository: navegsistemas/fluviapp-kmp
          token: ${{ secrets.FLUVIAPP_LEITURA_TOKEN }}
          path: fluviapp-kmp
      - uses: actions/checkout@v7
        with:
          repository: navegsistemas/fluviapp
          token: ${{ secrets.FLUVIAPP_LEITURA_TOKEN }}
          path: fluviapp
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Com CONTRATO_OBRIGATORIO, a camada 2 falha em vez de pular se um checkout faltar.
      - run: npx vitest run packages/domain/test/contrato-fluviapp.spec.ts
        env:
          FLUVIAPP_KMP: ${{ github.workspace }}/fluviapp-kmp
          FLUVIAPP_ORIGINAL: ${{ github.workspace }}/fluviapp
          CONTRATO_OBRIGATORIO: '1'
