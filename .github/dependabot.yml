# Atualizações semanais, agrupadas: um PR por ecossistema, e não um por pacote. Cada PR passa pelos mesmos
# checks de qualquer outro (`verificar.yml`).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
